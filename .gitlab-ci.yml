stages:
  - build
  - code_style
  - test

build_simplebashutils:
  stage: build
  tags:
    - tag1
  script:
    - cd C3_SimpleBashUtils-1/src/cat && make
    - cd ../grep && make
  artifacts:
    paths:
      - C3_SimpleBashUtils-1/src/cat/s21_cat
      - C3_SimpleBashUtils-1/src/grep/s21_grep
    expire_in: 30 days

check_code_style:
  stage: code_style
  tags:
    - tag1
  script:
    - echo "Running clang-format check..."
    - >
      find C3_SimpleBashUtils-1 -name "*.[ch]" -exec clang-format -n --verbose {} +
      || (echo "❌ Code style check failed!" && exit 1)

integration_tests:
  stage: test
  tags:
    - tag1
  dependencies:
    - build_simplebashutils
  script:
    - cd C3_SimpleBashUtils-1/src/cat
    - bash tests.sh
    - cd ../grep
    - make test

